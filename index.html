["How does WPA3 improve Wi-Fi security?",["Introduces stronger encryption and protects against weak passwords","Replaces MAC filtering","Requires fewer authentication steps","Uses weaker encryption for faster performance"],0,"Сильнее шифрование + защита от подбора слабых паролей (SAE). 🔑 SAE"],

];
const $=id=>document.getElementById(id);
let list=[],i=0,score=0,wrong=[],locked=false;
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){['menu','quiz','res'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}
function menu(){show('menu')}
function start(m,custom){
 let src=custom||(m==='v1'?V1.map((q,n)=>[...q,'v1']):m==='v2'?V2.map((q,n)=>[...q,'v2']):[...V1.map(q=>[...q,'v1']),...V2.map(q=>[...q,'v2'])]);
 if($('shuf').classList.contains('on'))src=sh(src);
 list=src;i=0;score=0;wrong=[];show('quiz');render();
}
function render(){
 locked=false;const q=list[i];
 let idx=[0,1,2,3];if($('shufo').classList.contains('on'))idx=sh(idx);
 $('cnt').textContent=(i+1)+' / '+list.length;$('sc').textContent=score;
 $('pb').style.width=(i/list.length*100)+'%';
 const L='ABCD';
 $('box').innerHTML='<div class="card"><span class="tag">MID '+q[4]+'</span><p class="q">'+q[0]+'</p>'+
 idx.map((o,k)=>'<button class="opt" data-o="'+o+'" onclick="pick(this)"><b>'+L[k]+'</b><span>'+q[1][o]+'</span></button>').join('')+'<div id="after"></div></div>';
}
function pick(el){
 if(locked)return;locked=true;const q=list[i],o=+el.dataset.o,ok=o===q[2];
 document.querySelectorAll('.opt').forEach(b=>{const v=+b.dataset.o;if(v===q[2])b.classList.add('ok');else if(b!==el)b.classList.add('dim')});
 if(ok){score++;$('sc').textContent=score;if(navigator.vibrate)navigator.vibrate(15)}else{el.classList.add('bad');wrong.push(q);if(navigator.vibrate)navigator.vibrate([40,40,40])}
 $('after').innerHTML='<div class="exp">'+(ok?'✅ Верно! ':'❌ Неверно. ')+q[3]+'</div><button class="btn" onclick="next()">'+(i+1<list.length?'Дальше →':'Результат 🏁')+'</button>';
 $('after').scrollIntoView({behavior:'smooth',block:'end'});
}
function next(){i++;if(i<list.length)render();else finish()}
function finish(){
 $('pb').style.width='100%';const p=Math.round(score/list.length*100);
 const col=p>=80?'#22c55e':p>=50?'#f59e0b':'#ef4444';
 show('res');
 $('res').innerHTML='<h1>Результат</h1><div class="ring" id="rg"><span>'+p+'%</span></div><p class="sub">'+score+' из '+list.length+' правильно</p>'+
 (wrong.length?'<button class="btn" onclick="retry()">Повторить ошибки ('+wrong.length+')</button>':'<p>🔥 Без ошибок!</p>')+
 '<button class="btn ghost" onclick="menu()">В меню</button>';
 let a=0;const t=setInterval(()=>{a+=2;if(a>=p){a=p;clearInterval(t)}$('rg').style.background='conic-gradient('+col+' '+a+'%,#24264a 0)'},16);
}
function retry(){start(null,wrong.slice())}
</script>
